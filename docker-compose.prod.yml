# Production overlay.
# Run:
#   APP_ENV_FILE=.env.prod APP_RUNTIME_ENV_FILE=.env.runtime \
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    restart: unless-stopped
    mem_limit: 512m
    ports: []

  redis:
    restart: unless-stopped
    mem_limit: 256m
    ports: []

  web:
    restart: unless-stopped
    mem_limit: 768m
    environment:
      APP_ENV: production
    command:
      [
        "bash",
        "-lc",
        "gunicorn --workers ${WEB_CONCURRENCY:-2} --threads ${WEB_THREADS:-4} --bind 0.0.0.0:8000 'app.factory:create_app()'",
      ]
    expose:
      - "8000"
    ports: []

  worker:
    restart: unless-stopped
    mem_limit: 1500m   # runs chromium+Xvfb for FB capture — the spiky one; swap-backed
    environment:
      APP_ENV: production

  scheduler:
    restart: unless-stopped
    mem_limit: 384m
    environment:
      APP_ENV: production

  bot:
    restart: unless-stopped
    mem_limit: 512m
    environment:
      APP_ENV: production

  listener:
    restart: unless-stopped
    mem_limit: 384m
    environment:
      APP_ENV: production

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      web:
        condition: service_healthy
    environment:
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?set MARKETING_DOMAIN in .env.prod}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.prod}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - recruit_net
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
