{% extends "_layout.html" %}
{% block content %}
<div style="max-width:400px;margin:40px auto">
  <h1>Create Account</h1>
  <p style="color:var(--muted);margin-bottom:1.5rem">14-day free trial. No credit card required.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="card" style="padding:1.5rem">
    <label>Email</label>
    <input name="email" type="email" required placeholder="you@company.com">
    <label>Password</label>
    <input name="password" type="password" required minlength="6" placeholder="Min 6 characters">
    <label>Company Name</label>
    <input name="company_name" required placeholder="Your business name">
    <button class="btn" type="submit" style="width:100%;margin-top:1rem">Start Free Trial</button>
  </form>
  <p style="text-align:center;margin-top:1rem;color:var(--muted)">
    Already have an account? <a href="/login">Sign in</a>
  </p>
</div>
{% endblock %}
