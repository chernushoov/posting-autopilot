{% extends "_layout.html" %}
{% block content %}
<div style="max-width:420px;margin:48px auto">
  <h1>Новый пароль</h1>
  {% if error %}<div class="alert error" style="margin:10px 0">{{ error }}</div>{% endif %}
  <form method="post" action="/reset-password" class="card" style="padding:1.5rem;margin-top:12px">
    <input type="hidden" name="token" value="{{ token }}">
    <input name="password" type="password" required minlength="6" placeholder="Новый пароль (мин. 6 символов)" style="width:100%;box-sizing:border-box">
    <button type="submit" class="btn" style="margin-top:12px;width:100%">Сохранить пароль</button>
  </form>
  <p style="margin-top:14px"><a href="/login">← Войти</a></p>
</div>
{% endblock %}
