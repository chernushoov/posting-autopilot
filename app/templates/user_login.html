{% extends "_layout.html" %}
{% block content %}
<div style="max-width:400px;margin:40px auto">
  <h1>Sign In</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="card" style="padding:1.5rem">
    <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
    <label>Email</label>
    <input name="email" type="email" required placeholder="you@company.com">
    <label>Password</label>
    <input name="password" type="password" required placeholder="Password">
    <button class="btn" type="submit" style="width:100%;margin-top:1rem">Sign In</button>
  </form>
  <p style="text-align:center;margin-top:1rem;color:var(--muted)">
    No account? <a href="/register">Create one — 14 days free</a>
  </p>
</div>
{% endblock %}
