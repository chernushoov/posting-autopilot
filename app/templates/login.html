<!DOCTYPE html>
<html lang="{{ ui_lang or 'en' }}" {% if is_rtl %}dir="rtl"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ ui("login_title") }} — Posting Autopilot</title>
<link rel="stylesheet" href="/static/app.css?v=20260613-tabbar">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/favicon-180.png">
<meta name="theme-color" content="#0071e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autopilot">
{% if is_rtl %}
<style>body{direction:rtl;text-align:right}.login-card form{text-align:right}</style>
{% endif %}
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='app-icon.svg') }}" alt="Posting Autopilot">
    <div class="login-brand">Posting<em>Autopilot</em></div>
    <p class="login-title">{{ ui("login_title") }}</p>
    <div class="lang-switcher" style="display:flex;gap:4px;justify-content:center;margin-bottom:20px">
      {% for l in (supported_langs or ['en','ru','he']) %}
        {% if l == (ui_lang or 'en') %}
          <span class="pill" style="background:var(--accent);color:#fff;border-color:var(--accent)">{{ l.upper() }}</span>
        {% else %}
          <a class="pill" href="/set-lang/{{ l }}">{{ l.upper() }}</a>
        {% endif %}
      {% endfor %}
    </div>
    <form method="post" class="stack">
      <div>
        <label>Email or admin login</label>
        <input name="login" type="text" placeholder="you@company.com" required autofocus>
      </div>
      <div>
        <label>{{ ui("password_field") }}</label>
        <input name="password" type="password" placeholder="{{ ui('password_field') }}" required>
      </div>
      <button type="submit" class="btn">{{ ui("enter_btn") }}</button>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
    </form>
    <p class="muted" style="font-size:13px;margin:16px 0 0;text-align:center">
      New here? <a href="{{ public_register_url }}">Create an account</a>
    </p>
  </div>
</div>
</body>
</html>
