services:
  - type: keyvalue
    name: posting-autopilot-preview-cache
    plan: free
    region: frankfurt
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: posting-autopilot-preview
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --no-cache-dir -r requirements-preview.txt
    startCommand: python scripts/start_render_preview.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: APP_ENV
        value: staging
      - key: FORCE_HTTPS
        value: "1"
      - key: ADMIN_LOGIN
        value: pilot-admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: posting-autopilot-preview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: posting-autopilot-preview-cache
          property: connectionString
      - key: RECRUITBOT_AI_PROVIDER
        value: stub
      - key: BILLING_ENABLED
        value: "0"
      - key: PREVIEW_SEED
        value: "1"

databases:
  - name: posting-autopilot-preview-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
