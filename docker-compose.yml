x-runtime-env: &runtime-env
  RECRUITBOT_TELEGRAM_BOT_TOKEN: ${RECRUITBOT_TELEGRAM_BOT_TOKEN}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  RECRUITBOT_AI_PROVIDER: ${RECRUITBOT_AI_PROVIDER}
  RECRUITBOT_AI_API_KEY: ${RECRUITBOT_AI_API_KEY}
  AI_PROVIDER: ${AI_PROVIDER}
  AI_API_KEY: ${AI_API_KEY}
  # RQ worker job timeout (seconds). Must exceed POST_DELAY_MAX in common/tg_client.py
  # plus Telethon connect/send margins so jobs don't silently expire mid-post.
  RQ_WORKER_TIMEOUT: ${RQ_WORKER_TIMEOUT:-900}
  DEFAULT_LANG: ${DEFAULT_LANG:-ru}
  # Hot lead notifications fallback — sent when company.owner_id is not a TG user_id.
  # Per-company override is RECRUIT_OPERATOR_NOTIFY_CHAT_<company_id>.
  RECRUIT_OPERATOR_NOTIFY_CHAT: ${RECRUIT_OPERATOR_NOTIFY_CHAT:-}
  # SMTP for email digest + hot-lead email notifications. Operator can leave
  # blank to skip email entirely (Telegram channel still works). Gmail App
  # Password recommended over real password (https://myaccount.google.com/apppasswords).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ra
    ports:
      # localhost-only: never expose the DB to the internet on a VPS
      - "127.0.0.1:5432:5432"
    volumes:
      - ra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF so the job queue and anti-spam counters survive restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ra_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: ["bash", "-lc", "python -m app.web"]
    env_file:
      - .env
      - .env.runtime
    environment: *runtime-env
    ports:
      # localhost-only: HTTPS termination (Caddy) proxies to this
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  worker:
    build: .
    restart: unless-stopped
    command: ["bash", "-lc", "python -m worker.run_worker"]
    env_file:
      - .env
      - .env.runtime
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  scheduler:
    build: .
    restart: unless-stopped
    command: ["bash", "-lc", "python -m worker.run_scheduler"]
    env_file:
      - .env
      - .env.runtime
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  bot:
    build: .
    command: ["bash", "-lc", "sleep 5 && python -u -m bot.run_bot"]
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
      - .env.runtime
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  ra_pg:
  ra_redis:
