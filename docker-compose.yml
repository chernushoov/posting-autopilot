x-runtime-env: &runtime-env
  RECRUITBOT_TELEGRAM_BOT_TOKEN: ${RECRUITBOT_TELEGRAM_BOT_TOKEN}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  RECRUITBOT_AI_PROVIDER: ${RECRUITBOT_AI_PROVIDER}
  RECRUITBOT_AI_API_KEY: ${RECRUITBOT_AI_API_KEY}
  AI_PROVIDER: ${AI_PROVIDER}
  AI_API_KEY: ${AI_API_KEY}
  RQ_WORKER_TIMEOUT: ${RQ_WORKER_TIMEOUT:-900}
  DEFAULT_LANG: ${DEFAULT_LANG:-ru}
  RECRUIT_OPERATOR_NOTIFY_CHAT: ${RECRUIT_OPERATOR_NOTIFY_CHAT:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

x-python-service: &python-service
  build: .
  init: true
  env_file:
    - ${APP_ENV_FILE:-.env}
    - ${APP_RUNTIME_ENV_FILE:-.env.runtime}
  environment:
    <<: *runtime-env
  networks:
    - recruit_net

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ra
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ra"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - recruit_net

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ra_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - recruit_net

  web:
    <<: *python-service
    command: ["bash", "-lc", "python -m app.web"]
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ra_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python scripts/service_healthcheck.py web"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  worker:
    <<: *python-service
    command: ["bash", "-lc", "python -m worker.run_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ra_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python scripts/service_healthcheck.py worker"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 20s

  scheduler:
    <<: *python-service
    command: ["bash", "-lc", "python -m worker.run_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ra_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python scripts/service_healthcheck.py scheduler"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 20s

  bot:
    <<: *python-service
    command: ["bash", "-lc", "python -u -m bot.run_bot"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ra_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python scripts/service_healthcheck.py bot"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s

  listener:
    <<: *python-service
    command: ["bash", "-lc", "python -m worker.tg_listener"]
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ra_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python scripts/service_healthcheck.py listener"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  ra_pg:
  ra_redis:
  ra_data:

networks:
  recruit_net:
