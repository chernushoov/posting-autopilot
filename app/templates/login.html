{% extends "_layout.html" %}
{% block content %}
<div style="max-width:420px;margin:48px auto">
  <h1 style="margin-bottom:8px">{{ ui("login_title") }}</h1>
  <p style="color:var(--muted);margin-bottom:1.5rem">{{ ui("login_no_account") }} <a href="/register">{{ ui("login_register_cta") }}</a></p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="card" style="padding:1.5rem">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label>{{ ui("login_id_label") }}</label>
    <input name="login" required autofocus autocomplete="username" placeholder="{{ ui('login_id_placeholder') }}">
    <label style="margin-top:1rem">{{ ui("password_field") }}</label>
    <input name="password" type="password" required autocomplete="current-password">
    <button class="btn" type="submit" style="width:100%;margin-top:1.25rem">{{ ui("enter_btn") }}</button>
  </form>
</div>
{% endblock %}
